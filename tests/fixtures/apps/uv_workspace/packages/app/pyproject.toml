[project]
name = "ws-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ws-lib",
    "colorama>=0.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
fancy = ["packaging>=24"]

[project.scripts]
ws-app = "ws_app:main"

[dependency-groups]
dev = ["installer>=0.7"]
tools = ["truststore>=0.9"]

[tool.uv.sources]
ws-lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.wheelship]
python = "3.12"

[tool.wheelship.scripts]
ws-app = { script = "ws-app" }

[[tool.wheelship.target]]
name = "linux"
platform = "linux-x86_64"
interpreter = "system"
formats = ["dir"]
