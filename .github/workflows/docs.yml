name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, zensical.toml, pyproject.toml, uv.lock, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, zensical.toml, pyproject.toml, uv.lock, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

# Let an in-progress deployment finish; queue the next one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --only-group docs
      - run: uv run --no-sync zensical build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Pages source must be set to "GitHub Actions" in the repository settings.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
