[project]
name = "cli-app"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "markupsafe>=2.1",
    "pygments>=2.17",
    "colorama>=0.4; sys_platform == 'win32'",
]

[project.scripts]
cli-app = "cli_app.main:main"

[project.gui-scripts]
cli-app-gui = "cli_app.main:gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.wheelship]
lock = "pylock.toml"
python = "3.12"

[[tool.wheelship.target]]
name = "linux"
platform = "linux-x86_64"
formats = ["dir", "archive", "exe"]

[[tool.wheelship.target]]
name = "linux-system"
platform = "linux-x86_64"
interpreter = "system"
formats = ["dir", "pyz", "exe"]

[[tool.wheelship.target]]
name = "windows"
platform = "windows-x86_64"
formats = ["archive", "exe"]

[[tool.wheelship.target]]
name = "windows-system"
platform = "windows-x86_64"
interpreter = "system"
formats = ["archive", "pyz"]
