[package]
name = "wheelship-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "wheelship_launcher"
path = "src/lib.rs"

# Console launcher (all platforms).
[[bin]]
name = "wheelship-launcher"
path = "src/main.rs"

# Windows GUI-subsystem launcher for gui_scripts (no console window).
# On Linux it is identical to the console launcher.
[[bin]]
name = "wheelship-launcher-gui"
path = "src/gui.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2"] }
# Inflate only, pure-Rust backend (miniz_oxide).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
