name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release launchers for every supported target. Linux builds go through
  # cargo-zigbuild against glibc 2.17 (the python-build-standalone baseline) so
  # they run on any manylinux2014-compatible system.
  launchers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: x86_64-unknown-linux-gnu, os: ubuntu-latest, zig: true }
          - { triple: aarch64-unknown-linux-gnu, os: ubuntu-latest, zig: true }
          - { triple: x86_64-pc-windows-msvc, os: windows-latest }
          - { triple: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: rustup target add ${{ matrix.triple }}
      - name: Build (zig, glibc 2.17)
        if: matrix.zig
        # cargo-zigbuild finds zig as `zig` on PATH or via `python3 -m ziglang`;
        # put both in one venv on PATH (an isolated `uv tool` env hides ziglang).
        run: |
          uv venv "$RUNNER_TEMP/zig"
          uv pip install --python "$RUNNER_TEMP/zig" cargo-zigbuild ziglang
          export PATH="$RUNNER_TEMP/zig/bin:$PATH"
          cargo zigbuild --release --locked --target ${{ matrix.triple }}.2.17
      - name: Build (msvc)
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p out/${{ matrix.triple }}
          src=target/${{ matrix.triple }}/release
          if [[ "${{ matrix.triple }}" == *windows* ]]; then
            cp $src/wheelship-launcher.exe $src/wheelship-launcher-gui.exe out/${{ matrix.triple }}/
          else
            cp $src/wheelship-launcher out/${{ matrix.triple }}/
          fi
          ls -l out/${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.triple }}
          path: out/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: |
          for t in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            rustup target add $t
            cargo clippy --locked --all-targets --target $t -- -D warnings
          done
      - run: cargo test --locked

  python:
    needs: launchers
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: launchers
          merge-multiple: true
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -v
        env:
          WHEELSHIP_LAUNCHER_DIR: ${{ github.workspace }}/launchers
          WHEELSHIP_TEST_REPORT: ${{ runner.temp }}/report.md
      - name: Measurements
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/report.md" 2>/dev/null || echo "(none)"

  wheel:
    needs: launchers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: packages/wheelship/src/wheelship/_launchers
          merge-multiple: true
      - run: uv build --package wheelship --wheel -o dist
      - name: Check the wheel carries every launcher
        run: |
          unzip -l dist/*.whl | tee listing
          for f in x86_64-unknown-linux-gnu/wheelship-launcher aarch64-unknown-linux-gnu/wheelship-launcher \
                   x86_64-pc-windows-msvc/wheelship-launcher.exe x86_64-pc-windows-msvc/wheelship-launcher-gui.exe \
                   aarch64-pc-windows-msvc/wheelship-launcher.exe aarch64-pc-windows-msvc/wheelship-launcher-gui.exe; do
            grep -q "wheelship/_launchers/$f" listing || { echo "missing $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/
