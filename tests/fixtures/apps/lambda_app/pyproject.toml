[project]
name = "lambda-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "markupsafe>=2.1",
    "attrs>=23",
    "colorama>=0.4; sys_platform == 'win32'",
    # Runtime Interface Client, used by the lambda-runtime (custom runtime) target.
    "awslambdaric>=3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.wheelship]
lock = "pylock.toml"
python = "3.12"

[[tool.wheelship.target]]
name = "lambda-x86"
platform = "lambda-x86_64"
formats = ["lambda-zip", "lambda-layer"]

[[tool.wheelship.target]]
name = "lambda-arm"
platform = "lambda-arm64"
formats = ["lambda-zip"]

[[tool.wheelship.target]]
name = "lambda-custom"
platform = "lambda-x86_64"
python = "3.14"                 # not offered as a managed runtime: bundled instead
formats = ["lambda-runtime"]

[tool.wheelship.lambda]
handler = "lambda_app.handler:handler"
