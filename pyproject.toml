[tool.uv.workspace]
members = ["packages/*"]
exclude = ["tests/fixtures/**"]

[tool.uv.sources]
wheelship = { workspace = true }

[dependency-groups]
dev = [
    "wheelship",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs network access (PyPI / GitHub); skipped when WHEELSHIP_OFFLINE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/wheelship/src"]

[tool.ruff.lint.isort]
known-first-party = ["wheelship", "tests"]

[tool.ruff.lint.per-file-ignores]
# Runs on the target interpreter, possibly old: keep %-formatting and plain code.
"packages/wheelship/src/wheelship/_boot.py" = ["UP", "SIM"]
