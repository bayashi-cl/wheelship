[project]
site_name = "wheelship"
site_description = "Build relocatable Python application bundles for Linux, Windows and AWS Lambda"
site_url = "https://bayashi-cl.github.io/wheelship/"
repo_url = "https://github.com/bayashi-cl/wheelship"
repo_name = "bayashi-cl/wheelship"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
nav = [
  { "Home" = "index.md" },
  { "Quick Start" = "quickstart.md" },
  { "Design (日本語)" = "design.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
